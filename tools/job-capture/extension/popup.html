<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RenderCV Job Capture</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>RenderCV Job Capture</h1>
      <details><summary>Companion connection</summary>
        <p>Open <a href="http://127.0.0.1:8765/setup" target="_blank" rel="noopener">local companion setup</a>, copy its connection code here, and connect once.</p>
        <label>Connection code <input id="connection-code" type="password" autocomplete="off"></label>
        <button id="connect" class="secondary">Connect companion</button><p id="connection-status" role="status"></p>
      </details>
      <div class="toolbar">
        <button id="refresh" class="secondary">Read current page</button>
        <button id="pick" class="secondary">Select description on page</button>
      </div>
      <label>Select from page
        <select id="pick-field"><option value="description">Description (multiple sections)</option><option value="title">Role</option><option value="company">Company</option></select>
      </label>
      <label>Role <input id="title" autocomplete="off"></label>
      <label>Company <input id="company" autocomplete="organization"></label>
      <label>One-off instructions <textarea id="instructions" rows="4" placeholder="E.g. emphasize Python and bioinformatics"></textarea></label>
      <p id="extraction">Reading the current page…</p>
      <label>Job description — review or edit before capturing
        <textarea id="description" rows="12" placeholder="Read the page, select a section, or paste the job description here."></textarea>
      </label>
      <label class="confirmation"><input id="confirm-description" type="checkbox"> I have checked the role, company, and description.</label>
      <details><summary>Saved site rules</summary>
        <label>Pages to match <input id="recipe-path" placeholder="/jobs/*"></label>
        <button id="save-recipe" class="secondary">Save current page selections</button>
        <p id="recipe-status" role="status"></p><div id="recipes"></div>
      </details>
      <button id="capture">Capture and analyze</button>
      <p id="status" role="status"></p>
      <section id="automation" hidden>
        <h2 id="automation-title">Tailoring analysis</h2>
        <p id="automation-status"></p>
        <button id="cancel-run" class="secondary" hidden>Cancel current run</button>
        <textarea id="automation-output" rows="12" readonly></textarea>
        <button id="retry" class="secondary" hidden>Retry analysis</button>
        <div id="approval" hidden>
          <label>Answers or approval notes
            <textarea id="answers" rows="5" placeholder="Answer any questions above, or write: No corrections; proceed."></textarea>
          </label>
          <button id="generate">Approve, generate, and render</button>
        </div>
      </section>
      <section id="result" hidden>
        <details>
          <summary>Manual prompt fallback</summary>
          <label>Prompt <textarea id="prompt" rows="10" readonly></textarea></label>
        </details>
        <button id="copy" class="secondary">Copy prompt</button>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
