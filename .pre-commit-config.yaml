repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args:
          - --skip=*.md,src/rendercv/schema/models/locale/other_locales/*
          - --exclude-file=schema.json
          # Danish words used in the public cover-letter template.
          - --ignore-words-list=januar,relevante
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty-check
        name: ty-check
        language: system
        entry: uv run --frozen --all-extras ty check src tests
        pass_filenames: false
